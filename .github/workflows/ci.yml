name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Format, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # `next build` also runs the TypeScript compiler, so it gates type errors too.
      - name: Build
        run: npm run build
